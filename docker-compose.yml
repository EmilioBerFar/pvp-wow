services:
  postgres:
    image: postgres:18-alpine
    container_name: pvp-wow-postgres
    environment:
      POSTGRES_USER: pvpwow
      POSTGRES_PASSWORD: pvpwow
      POSTGRES_DB: pvpwow
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ refuses a mount at /var/lib/postgresql/data: the image
      # now keeps its cluster in a versioned subdirectory so pg_upgrade can
      # work. The official layout for 18+ is a single mount one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvpwow -d pvpwow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
