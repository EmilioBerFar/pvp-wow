services:
  postgres:
    image: postgres:18-alpine
    container_name: pvp-wow-postgres
    environment:
      POSTGRES_USER: pvpwow
      POSTGRES_PASSWORD: pvpwow
      POSTGRES_DB: pvpwow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvpwow -d pvpwow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
