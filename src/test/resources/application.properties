# The credentials the tests boot the application with.
#
# The application refuses to START without a Battle.net client id and secret,
# and that is the point: an application that cannot authenticate should not
# pretend to be running. The tests need an application that DOES start, so
# they bring their own credentials - fake ones, for a provider they never
# actually call.
#
# This file is only on the test classpath, so it exists exactly when the
# tests run and never in a deployment. In a deployment the only source is the
# environment, which is the right way round.
#
# The values are not secrets. They are not credentials for anything.
spring.security.oauth2.client.registration.battle-net.client-id=${BATTLE_NET_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.battle-net.client-secret=${BATTLE_NET_CLIENT_SECRET:test-client-secret}
